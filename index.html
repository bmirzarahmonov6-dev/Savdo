<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volt – elektronika va gadjetlar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Onest:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f4f7;--ink:#0d0e13;--mute:#5d6170;--line:#dcdee6;--card:#fff;--ac:#6c7bff;--sale:#e11d48;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c10;--ink:#f1f2f6;--mute:#9a9fb0;--line:#23252f;--card:#14151b}}
:root[data-theme="dark"]{--bg:#0b0c10;--ink:#f1f2f6;--mute:#9a9fb0;--line:#23252f;--card:#14151b}
html{color-scheme:light dark;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Onest,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b0c10;z-index:30}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,12,16,.82);backdrop-filter:blur(14px);color:#f1f2f6;border-bottom:1px solid rgba(255,255,255,.08)}
.bar{max-width:1200px;margin:auto;height:62px;padding:0 20px;display:flex;align-items:center;gap:24px}
.logo{font:800 22px Sora,sans-serif;letter-spacing:-.04em;margin-right:auto}.logo i{color:var(--ac);font-style:normal}
.nav a{color:#c4c7d4;text-decoration:none;margin-right:22px;font-size:15px}
.cb{background:#f1f2f6;color:#0d0e13;padding:9px 18px;border-radius:99px;font-weight:600;text-decoration:none;font-size:15px}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.9)}}
main{max-width:1200px;margin:auto;padding:34px 20px 0}
h2{font:800 clamp(30px,5vw,52px)/1 Sora,sans-serif;letter-spacing:-.045em;margin:0 0 22px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;scrollbar-width:none}
.tab{flex:none;padding:10px 20px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.c{cursor:pointer}
.pic{position:relative;aspect-ratio:1/1.02;border-radius:28px;background:radial-gradient(circle at 50% 46%,hsl(var(--h) 85% 55%/.4),transparent 64%),linear-gradient(#181a24,#0b0c10);display:grid;place-items:center;overflow:hidden;transition:box-shadow .3s}
.pic svg{width:66%;filter:drop-shadow(0 22px 20px rgba(0,0,0,.5));transition:transform .45s cubic-bezier(.2,1,.3,1)}
.c:hover .pic{box-shadow:0 0 0 2px var(--ac)}.c:hover svg{transform:translateY(-8px) scale(1.06)}
.bd{position:absolute;top:14px;left:14px;z-index:2;background:#4f5cff;color:#fff;font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px}
.mt{display:flex;gap:10px;align-items:flex-start;padding:14px 4px 0}.mt div{flex:1;min-width:0}
.mt h3{margin:0;font-size:18px;font-weight:600}.mt small{color:var(--mute)}
.pr{font-weight:600;margin-top:4px}.old{color:var(--mute);text-decoration:line-through;font-weight:400;font-size:14px;margin-left:8px}
.add{flex:none;width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:24px}
footer{max-width:1200px;margin:60px auto 0;padding:30px 20px 50px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;backdrop-filter:blur(3px)}.ov.on{display:block}
.mv{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:14px}.mv.on{display:grid}
.mc{position:relative;background:var(--bg);border-radius:32px;width:min(860px,100%);max-height:94%;overflow:auto;display:grid;grid-template-columns:1fr 1fr;animation:in .45s both}
.mc .pic{margin:10px;aspect-ratio:auto;min-height:340px;border-radius:24px}.mc .pic svg{width:76%}
.mb{padding:28px 28px 28px 16px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.mb h2{font-size:32px;margin:0}.mb p{color:var(--mute);margin:0}
.sp{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}.sp li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.big{font:800 28px Sora,sans-serif}
.x{position:absolute;top:16px;right:18px;font-size:30px;line-height:1;z-index:2;background:var(--bg);width:40px;height:40px;border-radius:50%}
.btn{background:#4f5cff;color:#fff;padding:15px;border-radius:99px;font-weight:600;width:100%;font-size:17px}
.ord-form{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.ord-form input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit}
.msg{padding:24px 12px;text-align:center}.msg svg{width:84px;height:84px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140px);background:#f1f2f6;color:#0d0e13;padding:13px 24px;border-radius:99px;z-index:80;transition:transform .35s;font-weight:500;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
@media (max-width:860px){main{padding-top:24px}.nav{display:none}.mc{grid-template-columns:1fr}.mc .pic{min-height:240px}.mb{padding:8px 22px 26px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.mt h3{font-size:15px}.add{width:38px;height:38px;font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pic .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s cubic-bezier(.2,1,.3,1)}
.pic .emj{font-size:84px;line-height:1;filter:drop-shadow(0 22px 20px rgba(0,0,0,.5));transition:transform .45s cubic-bezier(.2,1,.3,1)}
.c:hover .pic .emj{transform:translateY(-8px) scale(1.06)}.c:hover .pimg{transform:scale(1.05)}
.mc .pic .emj{font-size:130px}
.err{color:var(--sale);font-size:13.5px;margin:0}.err:empty{display:none}
</style>
<script>
var PIXEL_ID="2164627230926549";
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
document,'script','https://connect.facebook.net/en_US/fbevents.js');
if(PIXEL_ID.indexOf("PIXEL_ID")<0){fbq('init',PIXEL_ID);fbq('track','PageView')}
function px(ev,x){try{if(!window.fbq||PIXEL_ID.indexOf("PIXEL_ID")>=0)return;
 fbq('track',ev,x?{content_name:x.n,content_category:x.c,value:x.p,currency:'UZS'}:undefined)}catch(e){}}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="mt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5f9"/><stop offset="1" stop-color="#8d93a3"/></linearGradient>
<linearGradient id="dk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4e5d"/><stop offset="1" stop-color="#14151b"/></linearGradient>
<linearGradient id="sc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f5cff"/><stop offset=".55" stop-color="#a86bff"/><stop offset="1" stop-color="#ff7ab8"/></linearGradient></defs></svg>
<header><div class="bar"><div class="logo" id="lg">volt<i>.</i></div><nav class="nav"><a href="#shop">Katalog</a><a href="#shop">Chegirmalar</a></nav><a class="cb" href="#shop">Buyurtma berish</a></div></header>
<main id="shop"><h2>Katalog</h2><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></main>
<footer id="ft">© 2026 Volt. Buyurtmadan keyin operator qo‘ng‘iroq qilib tasdiqlaydi.</footer>
<div class="ov" id="ov"></div><div class="mv" id="mv"><div class="mc" id="mc"></div></div>
<div class="toast" id="t"></div>
<script>
// ===== SOZLAMALAR (sizning saytingizdan, o'zgarmagan) =====
var CFG={api:"/api/lead",shop:"Onlayn Do'kon",phone:"+998901234567",tg:""};
var P=[
 {n:"Massaj qurilmasi (mini gun)",c:"Salomatlik",p:189000,o:329000,e:"💆",hit:1,
  d:"Yelka, bel va oyoq mushaklari uchun ixcham massaj qurilmasi. Uyda ham, safarda ham qulay.",
  f:["Bir necha tezlik rejimi","Almashtiriladigan nasadkalar","Zaryadlanadi, simsiz ishlaydi","Ixcham, sumkaga sig'adi"],oqim:""},
 {n:"Simsiz avtomobil changyutgichi",c:"Avto",p:149000,o:269000,e:"🚗",hit:1,
  d:"Mashina salonini bir necha daqiqada tozalash uchun kuchli va yengil changyutgich.",
  f:["Quruq va nam chang uchun","USB orqali zaryadlanadi","Qiyin joylar uchun uzun nasadka","Yengil va ixcham"],oqim:""},
 {n:"Mini LED proyektor",c:"Elektronika",p:349000,o:599000,e:"📽️",hit:0,
  d:"Uyda kino va multfilm ko'rish uchun ixcham proyektor. Telefon va noutbuk bilan ulanadi.",
  f:["Telefon, noutbuk va TV-box bilan ulanadi","Katta ekran effekti","Ixcham, olib yurish oson","Fokusni sozlash mumkin"],oqim:""},
 {n:"Smart soat",c:"Elektronika",p:179000,o:329000,e:"⌚",hit:1,
  d:"Qadamlar, qo'ng'iroq va bildirishnomalarni kuzatish uchun zamonaviy smart soat.",
  f:["Telefon bildirishnomalari soatda","Qadam va faollikni hisoblaydi","Bir necha xil tasma","Zaryadi uzoq saqlanadi"],oqim:""},
 {n:"Portativ blender (shaker)",c:"Uy-ro'zg'or",p:129000,o:229000,e:"🥤",hit:0,
  d:"Smuzi, kokteyl va sho'rvalar uchun ixcham zaryadlanadigan blender-shisha.",
  f:["USB orqali zaryadlanadi","Ish joyi, sport zali va safar uchun","Yuvish oson","Tez maydalaydi"],oqim:""},
 {n:"Yuz uchun massaj roller",c:"Go'zallik",p:79000,o:149000,e:"🧴",hit:0,
  d:"Kundalik yuz parvarishi uchun qulay massaj roller. Krem yoki serum bilan foydalaning.",
  f:["Kundalik parvarishga qulay","Yengil va ixcham","Krem bilan birga ishlatiladi","Sovitib ishlatish mumkin"],oqim:""},
 {n:"Muallimi Soniy (Tajvid qoidalari bilan)",c:"Kitoblar",p:55999,o:59000,e:"📖",hit:0,
  d:"Arab tili va tajvid qoidalarini o'rganib, Qur'on o'qishni o'rganish uchun kitob. QR-kod orqali audio ham eshitish mumkin.",
  f:["Arab tili va tajvid qoidalari","QR-kod orqali audio (Ustoz Shayx Alijon qori)","O'zbekiston bo'ylab yetkazib berish","Olganda to'lov"],oqim:"https://alijahon.uz/oqim/83246"}
];
var HU=[250,280,220,200,300,170,330,240],cat="Hammasi",cats=["Hammasi"];
var $=function(i){return document.getElementById(i)},G=function(i){return P.filter(function(x){return x.id==i})[0]};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function som(n){return n.toLocaleString("ru-RU")+" soʻm"}
function sid(x){var m=/(\d+)\/?\s*$/.exec(x.oqim||'');return m?m[1]:''}
function disc(x){return x.o>x.p?Math.round((1-x.p/x.o)*100):0}
function art(x,c){return x.im?'<img class="pimg'+(c?' '+c:'')+'" src="'+esc(x.im)+'" alt="" loading="lazy">':'<span class="emj'+(c?' '+c:'')+'">'+esc(x.e||'🛍️')+'</span>'}
function setP(list){P=list.filter(function(x){return x&&x.n&&x.p>0&&sid(x)});
 P.forEach(function(x,i){x.id=sid(x);x.h=HU[i%HU.length];if(!x.f)x.f=[]});
 cats=["Hammasi"].concat(P.map(function(x){return x.c}).filter(function(v,i,a){return v&&a.indexOf(v)===i}));if(cats.indexOf(cat)<0)cat="Hammasi"}
function loadP(){var ctl=window.AbortController?new AbortController():null,t=setTimeout(function(){if(ctl)ctl.abort()},4000);
 return fetch('/api/products',ctl?{signal:ctl.signal}:{}).then(function(r){return r.ok?r.json():null}).then(function(d){clearTimeout(t);return Array.isArray(d)?d:null}).catch(function(){return null})}
function toast(m){var t=$("t");t.textContent=m;t.classList.add("on");clearTimeout(t.k);t.k=setTimeout(function(){t.classList.remove("on")},1700)}
function tabs(){$("tabs").innerHTML=cats.map(function(c){return '<button class="tab" aria-pressed="'+(c==cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("")}
function card(x){return '<div class="c" data-v="'+x.id+'"><div class="pic" style="--h:'+x.h+'">'+(x.o>x.p?'<span class="bd">−'+disc(x)+'%</span>':'')+art(x)+'</div><div class="mt"><div><h3>'+esc(x.n)+'</h3><small>'+esc(x.f[0]||x.c||"")+'</small><div class="pr">'+som(x.p)+(x.o>x.p?'<span class="old">'+som(x.o)+'</span>':'')+'</div></div><button class="add" data-a="'+x.id+'" aria-label="Buyurtma berish">+</button></div></div>'}
function grid(){$("grid").innerHTML=P.filter(function(x){return cat=="Hammasi"||x.c==cat}).map(card).join("")}
function bindForm(){
 var ph=$("ph");if(!ph)return;
 ph.oninput=function(){var v=ph.value.replace(/\D/g,"");if(v.indexOf("998")===0)v=v.slice(3);v=v.slice(0,9);var o="+998";if(v.length)o+=" "+v.slice(0,2);if(v.length>2)o+=" "+v.slice(2,5);if(v.length>5)o+=" "+v.slice(5,7);if(v.length>7)o+=" "+v.slice(7,9);ph.value=o};
 ph.onfocus=function(){if(!ph.value)ph.value="+998 "};
 try{var s=JSON.parse(localStorage.getItem("sv_f")||"{}");if(s.n)$("nm").value=s.n;if(s.t)ph.value=s.t}catch(e){}
}
function view(id,focusForm){var x=G(id);if(!x)return;px('ViewContent',x);px('InitiateCheckout',x);
$("mc").innerHTML='<button class="x" data-close aria-label="Yopish">×</button><div class="pic" style="--h:'+x.h+'">'+art(x)+'</div><div class="mb"><small style="color:var(--mute)">'+esc(x.c||"")+'</small><h2>'+esc(x.n)+'</h2><p>'+esc(x.d||"")+'</p>'+(x.f.length?'<ul class="sp">'+x.f.map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ul>':'')+'<div class="big">'+som(x.p)+(x.o>x.p?'<span class="old">'+som(x.o)+'</span>':'')+'</div><div class="ord-form" id="of"><input id="nm" placeholder="Ismingiz" autocomplete="name"><input id="ph" type="tel" placeholder="Telefon: +998 90 123 45 67" autocomplete="tel"><div class="err" id="er"></div><button class="btn" data-buy="'+esc(id)+'">Buyurtma berish</button></div></div>';
$("mv").classList.add("on");$("ov").classList.add("on");bindForm();if(focusForm&&$("nm"))$("nm").focus()}
function shut(){$("mv").classList.remove("on");$("ov").classList.remove("on")}
function sendLead(id){var x=G(id);if(!x)return;
var n=$("nm").value.trim(),p=$("ph").value,tel="+"+p.replace(/\D/g,""),b=document.querySelector("[data-buy]");
if(n.length<2){$("er").textContent="Iltimos, ismingizni kiriting";return}
if(p.replace(/\D/g,"").length<12){$("er").textContent="Telefon raqamni to‘liq kiriting";return}
b.disabled=true;b.textContent="Yuborilmoqda...";$("er").textContent="";
fetch(CFG.api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({full_name:n,phone_number:tel,stream:sid(x)})})
.then(function(r){return{ok:r.ok,s:r.status}}).catch(function(){return{ok:false,s:0}})
.then(function(o){
 if(o.ok){px("Lead",x);try{localStorage.setItem("sv_f",JSON.stringify({n:n,t:p}))}catch(e){}
  $("of").innerHTML='<div class="msg"><svg viewBox="0 0 24 24" fill="none" stroke="#12a150" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.7 2.7L16 9.6"/></svg><h3 style="font-size:24px;margin:10px 0 6px">Rahmat, '+esc(n.split(/\s+/)[0])+'!</h3><p>Buyurtma qabul qilindi. Tez orada '+esc(p)+' raqamiga qo‘ng‘iroq qilamiz.</p><br><button class="btn" data-close>Davom etish</button></div>';return}
 b.disabled=false;b.textContent="Buyurtma berish";
 $("er").textContent=o.s===400?"Ism yoki telefon noto‘g‘ri. Tekshirib, qayta urinib ko‘ring":"Hozir yuborib bo‘lmadi. Qayta urinib ko‘ring yoki qo‘ng‘iroq qiling: "+CFG.phone})}
document.addEventListener("click",function(e){var t=e.target.closest("button,.c");if(!t)return;var d=t.dataset;
if(d.a){e.stopPropagation();view(d.a,true)}
else if(d.v)view(d.v,false);
else if(d.c){cat=d.c;tabs();grid()}
else if("close" in d)shut();
else if("buy" in d)sendLead(d.buy)});
$("ov").addEventListener("click",shut);
document.addEventListener("keydown",function(e){if(e.key=="Escape")shut()});
function route(){try{var m=/^#p(\d+)$/.exec(location.hash);if(m&&P[m[1]-1])view(P[m[1]-1].id,false)}catch(e){}}
function render(){tabs();grid()}
document.title=CFG.shop;$("lg").innerHTML=esc(CFG.shop)+"<i>.</i>";$("ft").textContent="© 2026 "+CFG.shop+". Buyurtmadan keyin operator qo‘ng‘iroq qilib tasdiqlaydi.";
setP(P);render();
loadP().then(function(d){if(d){setP(d);render()}route()});
</script>
</body>
</html>
